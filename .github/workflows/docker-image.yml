# Builds the motionbank-scores Docker image and smoke-tests the result,
# then publishes it to GHCR as
#
#     ghcr.io/<owner>/<repo>:latest      (moving tag)
#     ghcr.io/<owner>/<repo>:sha-<ref>   (immutable per-commit tag)
#
# The image does NOT contain the ~20 GiB media archive (it broke the
# runner's disk). Instead the container downloads media on first start
# (docker/media-entrypoint.sh, checksum-verified, override with MEDIA_URL,
# skip with MEDIA_DOWNLOAD=0 — see README "Media self-hosting"). This is
# why the build is small and fast, and why the smoke test runs with
# MEDIA_DOWNLOAD=0 and asserts that media is NOT baked in.
#
# - push to main      → build + smoke test + publish :latest
# - pull_request      → build + smoke test only
# - workflow_dispatch → build + smoke test + publish (manual rebuild)
name: docker-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: motionbank-scores

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image (media-free; container downloads on first start)
        run: docker build -t "$IMAGE_NAME:latest" .

      # MEDIA_DOWNLOAD=0: the runner must not pull the ~20 GiB media
      # archive. With media skipped the site itself must still serve, and
      # a media path must 404 (proves no media was baked in).
      - name: Smoke test
        env:
          RUN_ARGS: -d --name smoke-test -e MEDIA_DOWNLOAD=0 -p 8080:80
        run: |
          docker run $RUN_ARGS "$IMAGE_NAME:latest"
          sleep 3
          set -e
          for path in /dh/ /jbmf/ /two/ \
                      /api/jbmf/pm2/28689.json \
                      /dh/dhay/player/scenes/index.json \
                      /modules/jbmf/generators/05_clap/img/01-04up.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                        "http://localhost:8080$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path"
              docker logs smoke-test | tail -20
              exit 1
            fi
          done
          media_code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/media/dh/piecemaker/D05T01_Janine_sync_AJA_1.mp4")
          echo "media path without download -> $media_code"
          if [ "$media_code" != "404" ]; then
            echo "FAIL: expected 404 for unbaked media"
            docker logs smoke-test | tail -20
            exit 1
          fi
          docker rm -f smoke-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR (latest + sha tag)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag "$IMAGE_NAME:latest" "$IMAGE:latest"
          docker tag "$IMAGE_NAME:latest" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
