# nginx server config for the Motion Bank online scores (static site).
# Scores use hash-based routing (#/set/...), so no rewrite rules are needed —
# everything is served as plain static files.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve files; fall back to the landing page only for unknown
    # non-file paths so deep links don't 404 as raw errors.
    # HTML documents (incl. extensionless deep links served via index.html)
    # must revalidate so app updates take effect immediately.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # The score data (JSON) is fetched same-origin by the front-ends.
    location ~* \.json$ {
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Poster/upload images referenced by the JSON data.
    location /system/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Immutable-ish front-end bundles (versioned by deploy).
    # Code files must revalidate immediately (stale JS silently breaks the
    # site after an update); images/fonts are safe to cache for a day.
    location ~* \.(js|css|map)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Compress text-like responses (JS/CSS/JSON/HTML/SVG).
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    error_page 500 502 503 504 /50x.html;
}
