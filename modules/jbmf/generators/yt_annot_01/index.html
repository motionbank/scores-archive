<!doctype>
<html>
	<head>
		<meta charset="utf-8">
		<title>YouTube annotation test</title>
		<script type="text/javascript" src="js/jquery.min.js"></script>
		<script type="text/javascript" src="js/jquery.animate-colors.js"></script>
		<script type="text/javascript" src="js/postmessenger.js"></script>
		<script type="text/javascript" src="js/animframe.js"></script>
		<script type="text/javascript" src="js/timer.js"></script>
		<script type="text/javascript" src="js/locparams.js"></script>
		<script type="text/javascript">
			jQuery(function(){

				var location_params = LocationParams();

				if ( location_params.style ) {
					$(document.head).append('<link href="css/style-'+(+(location_params.style))+'.css" rel="stylesheet" />');
				}

				var parentWindow = null;
				var postmessenger = new PostMessenger(window);
				var listener_id = null;

				if ( location_params && 'domain' in location_params ) {
					postmessenger.accept( location_params.domain );
				}

				var ytId = location_params.ytid || null;
				var vId = +(location_params.vid) || null;

				if ( !(ytId || vId) ) {
					$(document.body).html( 'Need YT-ID or video ID!' );
					return;
				}

				var speed = location_params.speed || 1.0;

				// console.log( ytId, vId );

				var group = null, video = null;

				postmessenger.on('connect?',function(req,res){
					parentWindow = req.source;
					listener_id = req.data.listener_id;
					res.send('connect!');
				});

				postmessenger.on(/^>>.+/,function(req, res){
				});

				// PieceMaker 2 data, pre-extracted from the restored heroku pg dump
				// into static JSON (pm2-data/<vid>.json = {video, events};
				// pm2-data/yt-lookup.json maps a YouTube id to its vid).
				// Shape matches what PieceMakerApi returned (utc_timestamp as Date).
				var toDates = function ( e ) {
					e.utc_timestamp = new Date( e.utc_timestamp * 1000.0 );
					return e;
				};

				var loadVid = function ( vid, done ) {
					$.getJSON( '/api/jbmf/pm2/' + vid + '.json' )
						.done(function ( data ) {
							if ( data && data.video ) {
								data.video.utc_timestamp = new Date( data.video.utc_timestamp * 1000.0 );
								var annos = [];
								for ( var i = 0; i < (data.events||[]).length; i++ ) {
									if ( data.events[i].type === 'annotation' ) {
										annos.push( toDates( data.events[i] ) );
									}
								}
								done( data.video, annos );
							} else {
								$(document.body).html( 'No video!' );
							}
						})
						.fail(function ( jqxhr, status, err ) {
							console.log( 'No PM2 data for vid ' + vid + ':', status, err );
							$(document.body).html( 'No video!' );
						});
				};

				var pmFullyLoaded;

				var startWith = function ( v, events_found ) {
					if ( events_found.length > 0 ) {
						video = v;
						events = events_found;
						$(document.body).html( video.fields.title );
						pmFullyLoaded();
					} else {
						$(document.body).html( 'No annotations!' );
					}
				};

				if ( vId ) {
					loadVid( vId, startWith );
				} else if ( ytId ) {
					$.getJSON( '/api/jbmf/pm2/yt-lookup.json' )
						.done(function ( lookup ) {
							var vid = lookup && lookup[ytId];
							if ( vid ) {
								loadVid( vid, startWith );
							} else {
								$(document.body).html( 'No video!' );
							}
						})
						.fail(function () {
							$(document.body).html( 'No video!' );
						});
				} else {
					$(document.body).html( 'Need YT-ID or video ID!' );
					return;
				}

				var timer = new Timer(25);

				pmFullyLoaded = function pmFullyLoaded () {

					var lastEventTime  = events[events.length-1].utc_timestamp.getTime() 
									     - video.utc_timestamp.getTime();
					
					var firstEventTime = events[0].utc_timestamp.getTime() 				
										 - video.utc_timestamp.getTime();
					
					var last_event = null, last_i = 0;

					timer.start(function(t){
						for ( var i = last_i; i < events.length; i++ ) {
							var e = events[i];
							if ( Math.abs(((e.utc_timestamp.getTime() - video.utc_timestamp.getTime())-firstEventTime)-(t*speed)) < 50 ) {
								if ( e !== last_event ) {
									//console.log( e.fields.title );
									postmessenger.send(
										'>>ping',
										{title:e.fields.title},
										parentWindow,
										location_params.domain);
									last_event = e;
									last_i = i;
									// $(document.body).css({
									// 	backgroundColor: '#ff0000'
									// }).animate({
									// 	backgroundColor: '#ffffff'
									// },70);
								}
								break;
							}
						}
						if ( ((t*speed)+firstEventTime) > (lastEventTime + (events[events.length-1].duration * 1000.0)) ) {
							last_event = null;
							last_i = 0;
							timer.reset();
						}
					});
				}
			});
		</script>

</script>
	</head>
