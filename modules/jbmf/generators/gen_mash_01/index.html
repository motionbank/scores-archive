  	  <script type="text/javascript">

      jQuery.prototype.getRandom = function() {
        return $(this[Math.floor(Math.random()*this.length)]);
      };

      Array.prototype.getRandom = function() {
        return this[Math.floor(Math.random()*this.length)];
      };

      function shuffle(o){ 
          for(var j, x, i = o.length; i; j = parseInt(Math.random() * i), x = o[--i], o[i] = o[j], o[j] = x);
          return o;
      };

  	  jQuery(function($) {



        var ar = new Array();
        for (var i=0; i < 10; i++) {
          ar.push(i);
        };
        ar = shuffle(ar);
        for (var i=0; i < 5; i++) {
          var l = $('<img src="img/gra_08' + ar[i] + '.svg" alt="" class="line" />');
          l.css({
            "top":i*40
          });
          $(".container").append(l);
          var s = $('<img src="img/gra_08' + ar[i] + 's.svg" alt="" class="shadow" />');
          s.css({
            "top":1500+i*40
          });
          $(".shadow-container").append(s);
        };

        var cluck = new Cluck();

        function animation() {
          cluck.run();
          var dur = Math.random()*500+500;
          if (cluck.fast) {
            dur = cluck.duration + 100;
          }
          setTimeout(function() { animation(); }, dur);
        };

        animation();

  	  });

  	  </script>
