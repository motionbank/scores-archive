<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Head changer 04</title>
	
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
	
	<script src="js/jquery-1.8.2.min.js" type="text/javascript"></script>
	<script src="js/jquery-ui.min.js" type="text/javascript"></script>

  <script type="text/javascript" src="js/postmessenger.js"></script>
  <script type="text/javascript" src="js/locparams.js"></script>
  <script type="text/javascript" src="js/messaging.js"></script>
	
	<script src="js/Parts.js" type="text/javascript"></script>

	</script>
</head>
<body>

  
  <style type="text/css">

    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    
    #content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    #content > *{
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    
    #content img{
      width: 100%;
    }
    
    #face img,
    #head img {
      display: none;
    }
    
    #arms {
      overflow: hidden;
    }
    
    #arms img {
      position: absolute;
    }
    
    .asset-container,
    .asset-container img {
      display: none;
    }
    
    .show {
      display: block !important;
    }
    
  
  </style>
  
  
  <script type="text/javascript">
  
  function  randomFrom(_ar) {
    return _ar[Math.floor(Math.random()*_ar.length)];
  };
  
  
  jQuery(function($) {
    
    // pick random jq element
    $.prototype.random = function() {
      return $( this[Math.floor(Math.random()*this.length)] );
    };
    
    resize();
    
    // init parts
    var head = new Head( $("#top") );
    var arms = new Arms( $("#arms") );
    
    // head.run(700);
    // arms.run(700);
    
    // // run animation
    // setInterval(function() {
    //   if (!head.isRunning) head.run(1000);
    //   if (!arms.isRunning) arms.run(1000);
    // },2000);

    var default_speed = 500 + (Math.random() * 300);

    window.messaging = {
      '>>ping' : function (req, res) {
        if (!head.isRunning) head.run(default_speed);
        if (!arms.isRunning) arms.run(default_speed);
      }
    }
    function resize() {
      $("#arms").css({
        "height": ( $("#content").width()*0.9 )+"px"
      });
    };
    
    $(window).resize(function() {
      resize();
    });

  });
  
  </script>
  
  <div id="content">
    
    <div id="arms">
      <img src="assets/03_arms_03.svg" alt="" />
    </div>
    
    <div id="body">
      <img src="assets/03_body_04.svg" alt="" />
    </div>
    
    <div id="head">
      <div class="asset-container show">
        <img src="assets/top/04_h_circ0.svg" alt="" class="show"/>
      </div>
      <div class="asset-container">
        <img src="assets/top/04_h_quad0.svg" alt=""/>
      </div>
      <div class="asset-container">
        <img src="assets/top/04_h_tri0.svg" alt=""/>
      </div>
    </div>
    
    <div id="face-default">
      <div class="circ asset-container show">
        <img src="assets/top/04_f_default.svg" alt="" class="show"/>
      </div>
    </div>
    
    <div id="top">
      <div class="circ asset-container show" data-target=".circ">
        <img src="assets/top/04_circ0.svg" alt="" class="show"/>
        <img src="assets/top/04_t_body0.svg" alt=""/>
      </div>
      <div class="quad asset-container" data-target=".quad">
        <img src="assets/top/04_quad0.svg" alt=""/>
        <img src="assets/top/04_quad1.svg" alt=""/>
        <img src="assets/top/04_quad2.svg" alt=""/>
      </div>
      <div class="tri asset-container" data-target=".tri">
        <img src="assets/top/04_tri0.svg" alt=""/>
        <img src="assets/top/04_tri1.svg" alt=""/>
      </div>
    </div>
    
    <div id="face">
      <div class="circ asset-container">
        <img src="assets/top/04_f_circ0.svg" alt="" class=""/>
        <img src="assets/top/04_f_circ1.svg" alt=""/>
        <img src="assets/top/04_f_circ2.svg" alt=""/>
      </div>
      <div class="quad asset-container">
        <img src="assets/top/04_f_quad0.svg" alt=""/>
        <img src="assets/top/04_f_quad1.svg" alt=""/>
        <img src="assets/top/04_f_quad2.svg" alt=""/>
      </div>
      <div class="tri asset-container">
        <img src="assets/top/04_f_tri0.svg" alt=""/>
        <img src="assets/top/04_f_tri1.svg" alt=""/>
        <img src="assets/top/04_f_tri2.svg" alt=""/>
      </div>
    </div>
    
  </div>

</body>
</html>
