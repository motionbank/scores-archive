<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta charset="utf-8">
    <title>
      Motion Bank - score books module
    </title>

    <script src="/assets/javascripts/vendor/jquery-2.0.3.min.js" type="text/javascript"></script>

    <script src="js/locparams.js" type="text/javascript"></script>
    <script src="js/postmessenger.js" type="text/javascript"></script>
    <script src="js/messaging.js" type="text/javascript"></script>

    <script src="js/app.js" type="text/javascript"></script>

    <link href="/assets/fonts/open-sans.css" rel="stylesheet" type="text/css">

    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css" type="text/css">
  </head>
  
  <body>
    
    <script type="text/javascript">
      jQuery(function() {
        resize();
        $(window).resize(resize);
        function resize() {
          var imgHeight = $('body').hasClass('blank') ? $(window).height() - 50 : $(window).height() - 30;
          $(".slide-container img").css({
            height: imgHeight
          });
        };
      });
    </script>
    
    <div id="wrapper" class="score-book">
      <table cellspacing="0">
        <tbody>
          <tr>
            <td colspan="2" class="title">
              <span class="piece"></span>
              —
              <span class="performer"></span>
            </td>
          </tr>
          <tr class="slide-row">
            <td class="slide-container">
              <a class="prev" href="#"><div class="icon"></div></a>
              <a class="next" href="#"><div class="icon"></div></a>
              <img src="" alt="" class="slide">
            </td>
            <td>
              <div class="tab-container clearfix"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
  </body>
</html>
