<!doctype>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>An example IFrame</title>
		<script src="/assets/javascripts/vendor/jquery-2.0.3.min.js"></script>

		<!-- PostMessenger is a library to help with inter-window (frame) communication -->
		<script src="js/postmessenger.js" type="text/javascript"></script>
		<script src="js/locparams.js" type="text/javascript"></script>

		<!-- window.messaging -->
		<!-- .. is a helper that facilitates the connection to the system -->
		<script src="js/messaging.js" type="text/javascript"></script>

		<script type="text/javascript">
		$(function(){

			// for simpler access

			var messaging = window.messaging,
				$txt = $('textarea');

			// set it up to accept and handle '>>ping' and '>>pong' messages

			messaging['connect?'] = 
			messaging['activate!'] = 
			messaging['deactivate!'] =
			messaging['>>*'] =
			function ( message ) {
				// just output to textarea ...
				var dat = "";
				if ( message.data ) {
					if ( 'JSON' in window && JSON.stringify ) {
						dat = ' with data: ' + JSON.stringify( message.data );
					}
				}
				$txt.val( new Date().getTime() + ' received "'+message.name+'"' + dat + "\n" + $txt.val() );
			};
			
			// clicking the buttons
			$('input[type=button]').click(function(){
				messaging.send('>>' + $(this).attr('value'));
			});
			$('input[type=submit]').click(function(e){
				var message_id = $('input[type=text].key').val();
				var message_data = $('input[type=text].data').val();
				messaging.send( '>>' + message_id, message_data );
				e.preventDefault();
			});
		});
		</script>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<form>
			<input class="key" type="text" value="set-scene">
			<input class="data" type="text" value="tiptoeing">
			<input type="submit" value="send"><br/>
			<textarea></textarea>
		</form>
	</body>
</html>
