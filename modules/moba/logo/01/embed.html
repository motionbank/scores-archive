<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf8">
		<title>Motion Bank - Logo generator</title>

		<!--
		+
		+	Motion Bank, motionbank.org
		+
		+	fjenett, 2012-10
		+
		L + + + + + + + + + + + + + + + + + + + + + + + + -->

		<link type="text/css" rel="stylesheet" href="style.css">
		<link type="text/css" rel="stylesheet" href="style-embed.css">

		<script src="js/Detector.js" type="text/javascript"></script>
		<script src="js/jquery.min.js" type="text/javascript"></script>
		<script src="js/locparams.js" type="text/javascript"></script>
		<script src="js/three.min.js" type="text/javascript"></script>
		<script src="js/SVGRenderer.js" type="text/javascript"></script>
		<script src="js/jspdf.min.js" type="text/javascript"></script>
		<script src="js/PDFRenderer.min.js" type="text/javascript"></script>
		<script src="js/animationframe.js" type="text/javascript"></script>
		<script src="js/animator.js" type="text/javascript"></script>
		<script src="js/app.js" type="text/javascript"></script>

	<!-- GOOGLE ANALYTICS -->
  

  <script type="text/javascript">
  	jQuery(function(){
  		var r = function () {
  			window.motionbank.app.randomize();
  			setTimeout( r, 3000 );
  		}
  		r();
  	});
  </script>

	</head>
	<body>
		<div id="page">
			<header style="display:none">
				<h1><a href="http://motionbank.org/">Motion Bank</a> logo generator vers. 0.0.1</h1>
			</header>
			<section id="main">
				<div id="generator" style="position:absolute;top:0;left:0;right:0;bottom:0">
				</div>
				<div id="menu" style="display:none"><form>
					<select id="shapeChooser">
						<option value="box_02g_one_line">One line</option>
						<option value="box_02g_links">Aligned left</option>
						<option value="box_02g_zentriert">Centered</option>
						<option value="box_02g">Aligned right</option>
					</select>
					
					<input id="speedSlider" type="range" min="1" max="50" step="0.1" />
					<input id="elasticitySlider" type="range" min="1" max="30" step="0.1" />
					<input id="lengthSlider" type="range" min="0" max="100" step="0.1" />
					<input id="massSlider" type="range" min="1" max="30" step="0.1" />
					<input id="dampingSlider" type="range" min="80" max="100" step="0.1" />

					<input id="resetButton" type="button" value="Reset" />
					<input id="toggleButton" type="button" value="Show type" />
					<input id="saveButton" type="button" value="Save" />
				</form>
				</div>
				<div id="saves" style="display:none">
				</div>
				<div id="footer" style="display:none">
					Built with <a href="http://threejs.org/">three.js</a> and 
					<a href="https://github.com/fjenett/threejs-pdf-renderer">PDFRenderer.</a>
				</div>
			</section>
		</div>
	</body>
</html>
